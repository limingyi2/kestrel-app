name: Android

# A debug APK (arm64-v8a) for every Android change. Trusted push/dispatch builds
# use a stable test certificate; pull-request builds never receive signing secrets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NDK_VERSION: 27.2.12479018

jobs:
  # The path filter is a job, not `on.push.paths`, so the build is reported as skipped rather
  # than absent when the Android tree is untouched: branch protection requires this check,
  # and a check that never reports would block every docs-only pull request.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            android:
              - "android/**"
              - "scripts/android/**"
              - "scripts/rebrand.py"
              - "scripts/gen-android-icons.py"
              - ".github/workflows/android.yml"

  debug-apk:
    name: debug APK · arm64-v8a
    needs: changes
    if: (needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # android/deps/proot (our fork)

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # gomobile@latest wants the current Go; GOTOOLCHAIN=auto below lets `go` fetch a
          # newer one when it asks for it (setup-go v6+ pins the toolchain otherwise).
          go-version: "1.26"
          cache-dependency-path: android/deps/rclone-mobile/go.sum

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;35.0.0 cmake;3.22.1 ndk;${{ env.NDK_VERSION }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Prepare stable CI test signing
        id: ci-signing
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          KESTREL_DEBUG_KEYSTORE_BASE64: ${{ secrets.KESTREL_DEBUG_KEYSTORE_BASE64 }}
          KESTREL_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.KESTREL_DEBUG_KEYSTORE_PASSWORD }}
          KESTREL_DEBUG_KEY_ALIAS: ${{ secrets.KESTREL_DEBUG_KEY_ALIAS }}
          KESTREL_DEBUG_KEY_PASSWORD: ${{ secrets.KESTREL_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KESTREL_DEBUG_KEYSTORE_BASE64" || -z "$KESTREL_DEBUG_KEYSTORE_PASSWORD" || -z "$KESTREL_DEBUG_KEY_ALIAS" || -z "$KESTREL_DEBUG_KEY_PASSWORD" ]]; then
            echo "::error::Stable CI signing requires all four KESTREL_DEBUG_KEYSTORE_* / KESTREL_DEBUG_KEY_* repository Actions secrets. Refusing to create a non-upgradeable APK."
            exit 1
          fi
          key_path="$RUNNER_TEMP/kestrel-debug.p12"
          printf '%s' "$KESTREL_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          test -s "$key_path"
          echo "KESTREL_DEBUG_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          echo "Stable repository test signing configured."

      - name: Native artifacts (proot, Alpine rootfs, rclone.aar)
        env:
          GOTOOLCHAIN: auto
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export GOROOT="$(go env GOROOT)" GOPATH="$(go env GOPATH)"
          export PATH="$GOPATH/bin:$PATH" # gomobile / gobind land there
          bash scripts/android/build-natives.sh

      - name: assembleDebug (stable test signature)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        working-directory: android/src/android
        env:
          KESTREL_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.KESTREL_DEBUG_KEYSTORE_PASSWORD }}
          KESTREL_DEBUG_KEY_ALIAS: ${{ secrets.KESTREL_DEBUG_KEY_ALIAS }}
          KESTREL_DEBUG_KEY_PASSWORD: ${{ secrets.KESTREL_DEBUG_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:assembleDebug -Pkestrel.ciVersionCode="$((50 + GITHUB_RUN_NUMBER))" \
            -Pkestrel.ciVersionName="1.0.6-ci.${GITHUB_RUN_NUMBER}" --console=plain --no-daemon

      - name: assembleDebug (untrusted PR runner signature)
        if: github.event_name == 'pull_request'
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:assembleDebug -Pkestrel.ciVersionCode="$((50 + GITHUB_RUN_NUMBER))" \
            -Pkestrel.ciVersionName="1.0.6-pr.${GITHUB_RUN_NUMBER}" --console=plain --no-daemon

      # Our unit tests (io.github.nanomuse.*: the guards, the hub client, the sandbox paths, the
      # strings' parity), plus the upstream provider and sandbox tests, the two OpenMinis packages
      # our edits touch (#333, #334, #335). Same Gradle invocation as AGENTS.md; the compiled
      # classes are warm.
      - name: Unit tests
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:testDebugUnitTest --tests 'io.github.nanomuse.*' \
            --tests 'com.openminis.app.provider.*' --tests 'com.openminis.app.sandbox.*' \
            --console=plain --no-daemon

      # The on-device tests cannot run here (no emulator), but the source set must keep
      # compiling or io.github.nanomuse.reach.ReachHubInstrumentedTest never runs anywhere (#332).
      - name: androidTest compiles
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:compileDebugAndroidTestKotlin --console=plain --no-daemon

      - name: Badging
        run: |
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          badging="$("$bt/aapt" dump badging android/src/android/app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$badging" | grep -E "^package:|application-label:|native-code"
          expected_code="$((50 + GITHUB_RUN_NUMBER))"
          printf '%s\n' "$badging" | grep -F "package: name='io.github.limingyi2.kestrel' versionCode='$expected_code'" >/dev/null
          "$bt/apksigner" verify --print-certs android/src/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: kestrel-debug-apk-stable-signature
          path: android/src/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: kestrel-debug-apk-pr-ephemeral-signature
          path: android/src/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

